spark:
  app_name: etl
  master: local[*]
  config:
    spark.executor.memory: 4g
    spark.executor.cores: 2
    spark.sql.shuffle.partitions: 200
    spark.sql.adaptive.enabled: true

paths:
  raw_dir: data/raw
  processed_dir: data/processed

formats:
  input: csv
  output: hudi

logging:
  level: INFO