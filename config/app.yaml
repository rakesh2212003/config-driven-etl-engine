spark:
  app_name: "config-driven-etl-engine"
  master: "local[*]"

  config:
    # Core performance
    spark.driver.memory: "4g"
    spark.executor.memory: "4g"
    spark.sql.shuffle.partitions: "4"

    # Adaptive execution
    spark.sql.adaptive.enabled: "true"
    spark.sql.adaptive.coalescePartitions.enabled: "true"
    spark.sql.adaptive.skewJoin.enabled: "true"

    # Serialization
    spark.serializer: "org.apache.spark.serializer.KryoSerializer"

    # I/O optimization
    spark.sql.parquet.enableVectorizedReader: "true"
    spark.sql.files.maxPartitionBytes: "134217728"

    # Timezone consistency
    spark.sql.session.timezone: "UTC"

    # Stability
    spark.network.timeout: "800s"
    spark.executor.heartbeatInterval: "60s"

# ---------------------------
# RAW INPUT CONFIG
# ---------------------------
raw_layer:
  path: "data/raw"
  options:
    csv:
      header: true
      inferSchema: false
      encoding: "UTF-8"
      mode: "PERMISSIVE"
    parquet:
      mergeSchema: true
    json:
      multiline: true
      allowUnquotedFieldNames: false

# ---------------------------
# BOOKMARK CONFIG
# ---------------------------
mappings:
  scd_bookmark: "config/mappings/bookmark/scd_bookmark.json"
  data: "config/mappings/data"

# ---------------------------
# TABLE DEFINITIONS
# ---------------------------
tables:
  scd_customer:
    input_path: "data/raw/customer"
    output_path: "data/distilled/scd_customer"
    mapping_path: "config/mappings/data/scd_customer.json"
    format:
      input: "csv"
      output: "parquet"
    cdc:
      type: "incremental"
      column: "updated_timestamp"
    scd:
      enabled: true
      type: 2
      primary_key: ["customer_id"]
      effective_from_col: "effective_from"
      effective_to_col: "effective_to"
      current_row_col: "current_row"
      deleted_flag_col: "is_deleted"
      high_date: "9999-12-31 23:59:59"
