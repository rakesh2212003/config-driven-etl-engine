spark:
  app_name: "RAW2DIS"
  master: "local[*]"
  log_level: "WARN"
  config:
    spark.driver.memory: "4g"
    spark.sql.shuffle.partitions: 2
    spark.sql.adaptive.enabled: true
    spark.sql.adaptive.coalescePartitions.enabled: true
    spark.sql.parquet.enableVectorizedReader: true
    spark.sql.session.timezone: "UTC"
    spark.sql.legacy.timeParserPolicy: "CORRECTED"
    spark.serializer: "org.apache.spark.serializer.KryoSerializer"
    spark.sql.extensions: "org.apache.spark.sql.hudi.HoodieSparkSessionExtension"

raw_layer:
  path: "data/raw/"
  schema_path: "config/schemas/"
  corrupt_record_handling: "PERMISSIVE"   # PERMISSIVE | DROPMALFORMED | FAILFAST
  options:
    csv:
      header: true
      inferSchema: false
      encoding: "UTF-8"
      nullValue: ""
      emptyValue: ""
      multiline: false
      timestampFormat: "yyyy-MM-dd HH:mm:ss"
      dateFormat: "yyyy-MM-dd"
      columnNameOfCorruptRecord: "_corrupt_record"
    parquet:
      mergeSchema: true
    json:
      multiline: true
      allowUnquotedFieldNames: false

dis_layer:
  path: "data/distilled/"

bookmark:
  path: "data/bookmarks/bookmark.json"

retry:
  max_attempts: 3
  delay_seconds: 10
  backoff_multiplier: 2
  retriable_errors:
    - "AnalysisException"
    - "SparkException"
    - "HoodieException"

audit:
  enabled: true
  path: "data/audit/"
  fields:
    - run_id
    - table_name
    - cdc_file
    - rows_read
    - rows_inserted
    - rows_updated
    - rows_deleted
    - rows_rejected
    - started_at
    - finished_at
    - status                              # SUCCESS | FAILED

logging:
  level: "INFO"
  format: "log"
  path: "logs/"
  rotation:
    max_size_mb: 100
    backup_count: 5